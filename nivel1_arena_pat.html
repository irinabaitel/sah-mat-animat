<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const SAVE_KEY = 'stalemate_arena_ct2_progress';
const KIND_LABELS = { defend: 'SALVEAZĂ PRIN PAT', avoid: 'NU DA PAT' };
let hintStage = 0;
var sndMove = new Audio('Sounds/Move.mp3'), sndCapture = new Audio('Sounds/Capture.mp3'), sndMate = new Audio('Sounds/Mate.mp3');
var sndCheck = new Audio('Sounds/Check.mp3');
function playSnd(a) { try { a.currentTime = 0; a.play().catch(function () {}); } catch (e) {} }

let PUZZLES = [];
let chess   = null;
let board   = null;
let curIdx  = 0;
let curMoveIdx  = 0;
let completed   = {};
let solving     = false;
let solved      = false;
let solverColor = 'w';
let moveHistory = [];
let viewIdx     = 0;
let autoPlayTimer = null;
let selSq = null;
let pendingPromo = false;

/* ── Utils ── */
function debounce(fn, d) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), d); }; }

function clearHL() {
  document.querySelectorAll('.square-selected,.highlight-check,.last-move-from,.last-move-to,.sq-pat')
    .forEach(el => el.classList.remove('square-selected','highlight-check','last-move-from','last-move-to','sq-pat'));
}
function applyHL(sq, cls) {
  const el = document.querySelector('.square-' + sq);
  if (el) el.classList.add(cls);
}
function setLastMoveHL(from, to) {
  document.querySelectorAll('.last-move-from,.last-move-to')
    .forEach(el => el.classList.remove('last-move-from','last-move-to'));
  applyHL(from, 'last-move-from');
  applyHL(to,   'last-move-to');
}

function shakeBoard() {
  const bw = document.getElementById('boardWrapper');
  bw.classList.remove('board-shake');
  void bw.offsetWidth;
  bw.classList.add('board-shake');
  bw.addEventListener('animationend', () => bw.classList.remove('board-shake'), { once: true });
}

function celebrate() {
  confetti({ particleCount: 80, spread: 60, origin: { y: 0.60 } });
}

function setMsg(type, text) {
  const el = document.getElementById('taskMsg');
  el.className = 'task-msg' + (type ? ' ' + type : '');
  el.innerHTML = text;
}

/* ── Board callbacks ── */
function onDragStart(source, piece) {
  if (!solving || solved) return false;
  if (viewIdx < moveHistory.length) return false;
  if ((solverColor === 'w' && piece.startsWith('b')) ||
      (solverColor === 'b' && piece.startsWith('w'))) return false;
  return true;
}
function onDrop(source, target) {
  if (target === 'offboard' || source === target) return 'snapback';
  clearHL(); selSq = null;
  return tryMove(source, target);
}
function onSnapEnd() { if (chess && !pendingPromo) board.position(chess.fen()); }

/* ── Click-to-move ── */
$(document).on('click', '.square-55d63', function () {
  if (!solving || solved) return;
  if (viewIdx < moveHistory.length) return;
  const sq    = $(this).data('square');
  const piece = chess.get(sq);
  const moverColor = chess.turn();
  if (selSq) {
    const prevSq = selSq;
    clearHL(); selSq = null;
    if (sq === prevSq) return;
    if (piece && piece.color === moverColor) { selSq = sq; applyHL(sq, 'square-selected'); }
    else tryMove(prevSq, sq);
  } else {
    if (!piece || piece.color !== moverColor) return;
    selSq = sq; applyHL(sq, 'square-selected');
  }
});

/* ── Promotion picker ── */
function removePromoPicker() {
  const p = document.getElementById('promoPicker');
  const b = document.getElementById('promoBackdrop');
  if (p) p.remove();
  if (b) b.remove();
}

function showPromoPicker(from, to, color, onPick) {
  removePromoPicker();
  const bw = document.getElementById('boardWrapper');
  const sqEl = bw.querySelector('[data-square="' + to + '"]');
  if (!sqEl) { onPick(null); return; }
  const bwRect = bw.getBoundingClientRect();
  const sqRect = sqEl.getBoundingClientRect();
  const sz = sqEl.offsetWidth;
  const colCode = (color === 'w' ? 'w' : 'b');
  const pieces = ['q','r','b','n'];
  const overlay = document.createElement('div');
  overlay.id = 'promoPicker';
  overlay.style.width = sz + 'px';
  overlay.style.left = (sqRect.left - bwRect.left) + 'px';
  overlay.style.top  = (sqRect.top  - bwRect.top)  + 'px';
  pieces.forEach(function (p) {
    const cell = document.createElement('div');
    cell.className = 'promo-cell';
    cell.style.height = sz + 'px';
    cell.innerHTML = '<img src="https://lichess1.org/assets/piece/caliente/' +
                     colCode + p.toUpperCase() + '.svg" alt="">';
    cell.addEventListener('click', function (e) {
      e.stopPropagation();
      removePromoPicker();
      onPick(p);
    });
    overlay.appendChild(cell);
  });
  const cancel = document.createElement('div');
  cancel.className = 'promo-cancel';
  cancel.style.height = Math.round(sz * 0.55) + 'px';
  cancel.style.fontSize = Math.round(sz * 0.35) + 'px';
  cancel.textContent = '✕';
  cancel.addEventListener('click', function (e) {
    e.stopPropagation();
    removePromoPicker();
    onPick(null);
  });
  overlay.appendChild(cancel);
  const backdrop = document.createElement('div');
  backdrop.id = 'promoBackdrop';
  backdrop.addEventListener('click', function () {
    removePromoPicker();
    onPick(null);
  });
  document.body.appendChild(backdrop);
  bw.appendChild(overlay);
}

/* ── Move logic ── */
function promptText() {
  const p = PUZZLES[curIdx];
  const who = '<b>' + (solverColor === 'w' ? 'Albul' : 'Negrul') + ' la mutare.</b> ';
  return who + (p.kind === 'defend'
    ? 'Poziția e pierdută. Salvează partida prin pat.'
    : 'Ești în câștig. Joacă cea mai bună mutare, fără să dai pat.');
}
function kingSq(color) {
  const B = chess.board();
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const q = B[r][c];
    if (q && q.type === 'k' && q.color === color) return 'abcdefgh'[c] + (8 - r);
  }
  return null;
}
function markState() {
  if (!chess) return;
  document.querySelectorAll('.highlight-check,.sq-pat').forEach(el => el.classList.remove('highlight-check','sq-pat'));
  if (chess.in_check()) applyHL(kingSq(chess.turn()), 'highlight-check');
  else if (chess.in_stalemate()) applyHL(kingSq(chess.turn()), 'sq-pat');
}
function afterMoveFx(move) {
  if (chess.in_checkmate()) playSnd(sndMate);
  else if (chess.in_check()) playSnd(sndCheck);
  else playSnd(move.captured ? sndCapture : sndMove);
  markState();
}

function finishUserMove(from, to, promotion) {
  const move = chess.move({ from, to, promotion: promotion || 'q' });
  if (!move) { board.position(chess.fen(), false); return; }
  board.position(chess.fen(), true);
  recordMove(from, to, promotion);
  setLastMoveHL(from, to);
  afterMoveFx(move);
  clearPracHint(); hintStage = 0;
  curMoveIdx++;
  if (curMoveIdx >= PUZZLES[curIdx].moves.length) {
    onSolved();
  } else {
    setMsg('idle', '✓ Bună mutare! Răspunde adversarul…');
    setTimeout(opponentReply, 600);
  }
}

function wrongMove(from, to, prom) {
  const p = PUZZLES[curIdx];
  const t = new Chess(chess.fen());
  const m = t.move({ from, to, promotion: prom || 'q' });
  let txt = '❌ Nu e cea mai bună mutare. Mai încearcă!';
  if (m && t.in_stalemate() && p.kind === 'avoid') txt = '❌ Ai da pat și partida s-ar termina la egalitate. Caută altă mutare!';
  else if (m && p.kind === 'defend') txt = '❌ Așa nu se salvează partida. Mai încearcă!';
  shakeBoard();
  setMsg('err', txt);
  setTimeout(() => { if (solving && !solved) setMsg('idle', promptText()); }, 1800);
}

function tryMove(from, to) {
  if (!solving || solved) return 'snapback';
  if (!chess.moves({ square: from, verbose: true }).some(m => m.to === to)) return 'snapback';
  const expected = PUZZLES[curIdx].moves[curMoveIdx];
  const piece   = chess.get(from);
  const isProm  = piece && piece.type === 'p' && (to[1] === '8' || to[1] === '1');
  const expProm = expected.length > 4 ? expected.slice(4) : null;

  if (isProm) {
    pendingPromo = true;
    const visual = board.position();
    if (visual[from]) {
      visual[to] = visual[from];
      delete visual[from];
      board.position(visual, false);
    }
    showPromoPicker(from, to, piece.color, function (chosen) {
      pendingPromo = false;
      if (chosen === null) {
        board.position(chess.fen(), false);
        return;
      }
      if (from !== expected.slice(0,2) || to !== expected.slice(2,4) || chosen !== expProm) {
        board.position(chess.fen(), false);
        wrongMove(from, to, chosen);
        return;
      }
      finishUserMove(from, to, chosen);
    });
    return undefined;
  }

  if (from !== expected.slice(0,2) || to !== expected.slice(2,4)) {
    wrongMove(from, to, 'q');
    return 'snapback';
  }
  finishUserMove(from, to, 'q');
  return undefined;
}

function opponentReply() {
  if (curMoveIdx >= PUZZLES[curIdx].moves.length) return;
  const mv = PUZZLES[curIdx].moves[curMoveIdx];
  const prom = mv.length > 4 ? mv.slice(4) : 'q';
  const moveObj = chess.move({ from: mv.slice(0,2), to: mv.slice(2,4), promotion: prom });
  if (moveObj) {
    board.position(chess.fen(), true);
    recordMove(mv.slice(0,2), mv.slice(2,4), prom);
    setLastMoveHL(mv.slice(0,2), mv.slice(2,4));
    afterMoveFx(moveObj);
    curMoveIdx++;
    if (curMoveIdx >= PUZZLES[curIdx].moves.length) onSolved();
    else setMsg('idle', 'E rândul tău.');
  }
}

function onSolved() {
  solved = true; solving = false;
  completed[curIdx] = true;
  saveState(); updateProgress(); celebrate();
  setMsg('ok', '✅ ' + PUZZLES[curIdx].expl);
  document.getElementById('nextBtn').disabled = (curIdx >= PUZZLES.length - 1);
  document.getElementById('btnHint').disabled = true;
  document.getElementById('btnSol').disabled  = true;
  if (Object.keys(completed).length >= PUZZLES.length) {
    document.getElementById('playAgainBtn').style.display = 'flex';
  }
}

/* ── Move history (step ◄ ►) ── */
function recordMove(from, to, prom) {
  moveHistory.push({ from, to, prom: prom || 'q' });
  viewIdx = moveHistory.length;
  updateNavBtns();
}

function replayToPos(idx) {
  const temp = new Chess(PUZZLES[curIdx].fen);
  for (let i = 0; i < idx; i++) {
    const m = moveHistory[i];
    temp.move({ from: m.from, to: m.to, promotion: m.prom });
  }
  board.position(temp.fen(), false);
  clearHL();
  if (idx > 0 && moveHistory[idx - 1]) {
    applyHL(moveHistory[idx - 1].from, 'last-move-from');
    applyHL(moveHistory[idx - 1].to,   'last-move-to');
  }
  const keep = chess; chess = temp; markState(); chess = keep;
}

function stepBack()    { if (viewIdx > 0) { viewIdx--; replayToPos(viewIdx); updateNavBtns(); } }
function stepForward() { if (viewIdx < moveHistory.length) { viewIdx++; replayToPos(viewIdx); updateNavBtns(); } }
function updateNavBtns() {
  document.getElementById('stepBackBtn').disabled = (viewIdx <= 0);
  document.getElementById('stepFwdBtn').disabled  = (viewIdx >= moveHistory.length);
}

/* ── Puzzle loading ── */
function loadPuzzle(idx) {
  if (idx < 0 || idx >= PUZZLES.length) return;
  if (autoPlayTimer) { clearTimeout(autoPlayTimer); autoPlayTimer = null; }
  removePromoPicker();
  pendingPromo = false;
  curIdx = idx; curMoveIdx = 0; solved = false; selSq = null;
  moveHistory = []; viewIdx = 0;
  document.getElementById('playAgainBtn').style.display = 'none';
  if (window._annClear) window._annClear();

  const p = PUZZLES[idx];
  chess = new Chess(p.fen);

  curMoveIdx = 0;
  clearPracHint(); hintStage = 0;

  solverColor = chess.turn();
  board.orientation(solverColor === 'w' ? 'white' : 'black');
  board.position(chess.fen(), false);

  updatePuzzleUI();
  updateProgress();
  saveState();

  if (completed[idx]) {
    solving = false; solved = true;
    setMsg('ok', '✅ Deja rezolvat — poți încerca din nou!');
    document.getElementById('nextBtn').disabled = (curIdx >= PUZZLES.length - 1);
    document.getElementById('btnHint').disabled = true;
    document.getElementById('btnSol').disabled  = true;
  } else {
    solving = true;
    setMsg('idle', promptText());
    document.getElementById('nextBtn').disabled = true;
    document.getElementById('btnHint').disabled = false;
    document.getElementById('btnSol').disabled  = false;
  }
  clearHL();
  markState();
}

function updatePuzzleUI() {
  const p   = PUZZLES[curIdx];
  const badge = document.getElementById('turnBadge');
  if (solverColor === 'w') { badge.textContent = '⬜ Albul mută'; badge.className = 'turn-badge white'; }
  else                     { badge.textContent = '⬛ Negrul mută'; badge.className = 'turn-badge black'; }
  const lb  = document.getElementById('levelBadge');
  lb.textContent = KIND_LABELS[p.kind];
  lb.className   = 'level-badge' + (p.kind === 'avoid' ? ' med' : '');
  document.getElementById('prevBtn').disabled = (curIdx === 0);
}

/* ── Progress & state ── */
function updateProgress() {
  const done = Object.keys(completed).length;
  document.getElementById('progressFill').style.width = (done / PUZZLES.length * 100) + '%';
  document.getElementById('progressOuter').setAttribute('data-tip', done + ' / ' + PUZZLES.length + ' rezolvate');
  const rb = document.getElementById('resetAllBtn');
  if (rb) rb.style.display = (done > 0 && done < PUZZLES.length) ? 'flex' : 'none';
}

function saveState() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ idx: curIdx, completed })); } catch(e) {}
}
function loadState() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (!d) return;
    const raw = d.completed || {};
    completed = {};
    for (const k in raw) { const n = Number(k); if (!isNaN(n)) completed[n] = true; }
    curIdx = typeof d.idx === 'number' ? Math.min(d.idx, PUZZLES.length - 1) : 0;
  } catch(e) {}
}

/* ── Button handlers ── */
function prevPuzzle()     { if (curIdx > 0) loadPuzzle(curIdx - 1); }
function nextPuzzle()     { if (curIdx < PUZZLES.length - 1) loadPuzzle(curIdx + 1); }
function resetPuzzle()    { loadPuzzle(curIdx); }
function continuePuzzle() {
  const keys = Object.keys(completed).map(Number);
  const max  = keys.length ? Math.max(...keys) : -1;
  loadPuzzle(Math.min(max + 1, PUZZLES.length - 1));
}

function clearPracHint() {
  document.querySelectorAll('.hint-square').forEach(el => el.classList.remove('hint-square'));
  const sv = document.getElementById('prac-hint-svg'); if (sv) sv.remove();
}
function drawPracHintArrow(from, to) {
  const old = document.getElementById('prac-hint-svg'); if (old) old.remove();
  const NS = 'http://www.w3.org/2000/svg';
  const bw = document.getElementById('boardWrapper'); if (!bw) return;
  const ori = board.orientation();
  const tlSq = bw.querySelector('[data-square="' + (ori === 'white' ? 'a8' : 'h1') + '"]');
  let sqSz, svgX = 0, svgY = 0;
  if (tlSq) {
    sqSz = tlSq.offsetWidth;
    const bwRect = bw.getBoundingClientRect(), tlRect = tlSq.getBoundingClientRect();
    svgX = Math.round(tlRect.left - bwRect.left); svgY = Math.round(tlRect.top - bwRect.top);
  } else { sqSz = bw.offsetWidth / 8; }
  const sz = sqSz * 8;
  const svg = document.createElementNS(NS, 'svg');
  svg.id = 'prac-hint-svg';
  svg.style.cssText = 'position:absolute;pointer-events:none;z-index:20;';
  svg.style.left = svgX + 'px'; svg.style.top = svgY + 'px';
  svg.style.width = sz + 'px'; svg.style.height = sz + 'px';
  const defs = document.createElementNS(NS, 'defs'); svg.appendChild(defs);
  const col = 'rgba(60,190,80,0.92)';
  const mk = document.createElementNS(NS, 'marker');
  mk.setAttribute('id', 'phintarr'); mk.setAttribute('markerWidth', '4'); mk.setAttribute('markerHeight', '4');
  mk.setAttribute('refX', '3.5'); mk.setAttribute('refY', '2'); mk.setAttribute('orient', 'auto');
  const mp = document.createElementNS(NS, 'path'); mp.setAttribute('d', 'M0,0 L4,2 L0,4 L1,2 Z'); mp.setAttribute('fill', col);
  mk.appendChild(mp); defs.appendChild(mk);
  function sqCenter(sq) { let c = sq.charCodeAt(0) - 97, r = parseInt(sq[1]) - 1; if (ori === 'black') { c = 7 - c; r = 7 - r; } const q = sz / 8; return { x: c * q + q / 2, y: (7 - r) * q + q / 2 }; }
  const f = sqCenter(from), t = sqCenter(to), dx = t.x - f.x, dy = t.y - f.y, len = Math.sqrt(dx * dx + dy * dy);
  if (len < 1) return;
  const ux = dx / len, uy = dy / len, SW = Math.max(3, sqSz * 0.09);
  const ln = document.createElementNS(NS, 'line');
  ln.setAttribute('x1', f.x); ln.setAttribute('y1', f.y); ln.setAttribute('x2', t.x - ux * SW); ln.setAttribute('y2', t.y - uy * SW);
  ln.setAttribute('stroke', col); ln.setAttribute('stroke-width', String(SW)); ln.setAttribute('stroke-linecap', 'round');
  ln.setAttribute('marker-end', 'url(#phintarr)');
  svg.appendChild(ln);
  bw.appendChild(svg);
}
/* Indiciu în trepte: 1) pătratul piesei → 2) + săgeata → 3) mutarea scrisă */
function showHint() {
  if (!solving || solved || viewIdx < moveHistory.length) return;
  const p = PUZZLES[curIdx];
  const mv = p.moves[curMoveIdx];
  const from = mv.slice(0, 2), to = mv.slice(2, 4);
  hintStage = Math.min(hintStage + 1, 3);
  clearPracHint();
  applyHL(from, 'hint-square');
  if (hintStage === 1) setMsg('idle', '💡 Mută piesa marcată cu verde.');
  else drawPracHintArrow(from, to);
  if (hintStage === 2) setMsg('idle', '💡 Urmează săgeata.');
  if (hintStage === 3) setMsg('idle', '💡 Mutarea: <b>' + p.san[curMoveIdx] + '</b>');
}

function showSolution() {
  if (autoPlayTimer) { clearTimeout(autoPlayTimer); autoPlayTimer = null; }
  removePromoPicker();
  clearPracHint(); hintStage = 0;
  solving = false;
  const p = PUZZLES[curIdx];
  chess = new Chess(p.fen);
  moveHistory = []; viewIdx = 0;
  board.position(p.fen, false);
  clearHL(); updateNavBtns();
  document.getElementById('btnHint').disabled = true;
  document.getElementById('btnSol').disabled  = true;
  setMsg('idle', '🔑 Arăt soluția…');
  const playNext = () => {
    if (viewIdx >= p.moves.length) {
      setMsg('idle', '🔑 ' + p.expl + '<br>Apasă „↺ Resetează" ca s-o încerci tu.');
      return;
    }
    const mv = p.moves[viewIdx];
    const m = { from: mv.slice(0,2), to: mv.slice(2,4), prom: mv.length > 4 ? mv.slice(4) : 'q' };
    const mo = chess.move({ from: m.from, to: m.to, promotion: m.prom });
    board.position(chess.fen(), true);
    moveHistory.push(m);
    viewIdx++;
    setLastMoveHL(m.from, m.to);
    if (mo) afterMoveFx(mo);
    updateNavBtns();
    autoPlayTimer = setTimeout(playNext, 700);
  };
  playNext();
}

function resetAllProgress() {
  try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
  completed = {};
  updateProgress();
  loadPuzzle(0);
}

/* ── Init ── */
board = Chessboard('board', {
  position:   'start',
  pieceTheme: 'https://lichess1.org/assets/piece/caliente/{piece}.svg',
  draggable:  true,
  onDragStart, onDrop, onSnapEnd
});

fetch('data/stalemate_arena.json?v=20261110')
  .then(r => r.json())
  .then(data => {
    PUZZLES = data;
    loadState();
    updateProgress();
    loadPuzzle(curIdx);
  })
  .catch(e => {
    setMsg('err', '⚠ Nu am putut încărca puzzle-urile. Verifică data/stalemate_arena.json');
    console.error(e);
  });

window.addEventListener('resize', debounce(() => { removePromoPicker(); board.resize(); clearPracHint(); hintStage = 0; markState(); }, 150));
</script>
<script src="board-utils.js"></script>
</body>
